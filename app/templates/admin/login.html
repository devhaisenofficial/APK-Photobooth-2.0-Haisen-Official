<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Haisen Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .input-field {
            width: 100%; padding: 12px 16px; background: #f9f9fb;
            border: 1px solid #e5e7eb; border-radius: 12px; font-size: 13px;
            outline: none; transition: all 0.2s; color: #111827;
        }
        .input-field:focus { border-color: #111827; background: #fff; box-shadow: 0 0 0 3px rgba(17,24,39,0.06); }
        .btn-primary {
            width: 100%; padding: 13px; background: #111827; color: #fff;
            border-radius: 12px; font-size: 13px; font-weight: 600;
            border: none; cursor: pointer; transition: all 0.2s;
        }
        .btn-primary:hover { background: #000; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
        .btn-primary:active { transform: translateY(0); }
    </style>
</head>
<body class="min-h-screen bg-[#f4f4f6] flex items-center justify-center p-4">
    <div class="w-full max-w-sm">

        <!-- Logo & Title -->
        <div class="text-center mb-8">
            <div class="w-14 h-14 bg-gray-900 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
            </div>
            <h1 class="text-xl font-bold text-gray-900">Haisen Studio</h1>
            <p class="text-xs text-gray-400 mt-1">Admin Control Panel v2.0</p>
        </div>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="mb-4 p-3.5 rounded-xl text-xs font-medium
                    {% if category == 'success' %}bg-emerald-50 text-emerald-700 border border-emerald-100
                    {% else %}bg-rose-50 text-rose-700 border border-rose-100{% endif %}">
                    {{ message }}
                </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Login Card -->
        <div class="bg-white rounded-2xl p-7 shadow-sm border border-gray-100">
            <h2 class="text-sm font-semibold text-gray-800 mb-5">Masuk ke Panel Admin</h2>

            <form method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1.5">Username</label>
                    <input type="text" name="username" class="input-field" placeholder="Masukkan username" autocomplete="username" required>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1.5">Password</label>
                    <input type="password" name="password" class="input-field" placeholder="••••••••" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn-primary mt-2">
                    Masuk
                </button>
            </form>
        </div>

        <p class="text-center text-[11px] text-gray-400 mt-6">
            Haisen Photobooth System &copy; 2024
        </p>
    </div>
</body>
</html>
