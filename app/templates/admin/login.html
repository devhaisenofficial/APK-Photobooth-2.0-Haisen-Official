<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haisen Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0;
            overflow: hidden; 
        }
        
        /* Video Background Settings */
        .video-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translateX(-50%) translateY(-50%) scale(1.1); 
            z-index: -2;
            object-fit: cover;
            filter: blur(6px); 
        }

        /* Overlay gelap */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(17, 24, 39, 0.45); 
            z-index: -1;
        }

        /* Glassmorphism Card dengan Kedalaman & Pencahayaan 3D */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            /* Border 3D: atas-kiri terang (pantulan cahaya), bawah-kanan gelap (bayangan) */
            border-top: 1px solid rgba(255, 255, 255, 0.9);
            border-left: 1px solid rgba(255, 255, 255, 0.8);
            border-right: 1px solid rgba(255, 255, 255, 0.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            /* Bayangan ganda untuk kedalaman melayang yang realistis */
            box-shadow: 
                0 30px 60px -12px rgba(0, 0, 0, 0.4),
                0 18px 36px -18px rgba(0, 0, 0, 0.3);
        }

        /* Logo Box dengan efek melayang (Neumorphic Pop) */
        .logo-box {
            background: linear-gradient(135deg, #ffffff 0%, #f3f4f6 100%);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 
                6px 6px 16px rgba(0, 0, 0, 0.08),
                -6px -6px 16px rgba(255, 255, 255, 0.6),
                inset 0 1px 2px rgba(255, 255, 255, 1);
        }

        /* Input Field dengan efek menjorok ke dalam (Inner Depth) */
        .input-field {
            width: 100%; 
            padding: 13px 16px; 
            background: rgba(243, 244, 246, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.5); 
            border-radius: 12px; 
            font-size: 14px;
            outline: none; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            color: #111827;
            /* Inner shadow menciptakan ilusi "lubang" ke dalam */
            box-shadow: 
                inset 0 3px 6px rgba(0, 0, 0, 0.06),
                inset 0 1px 3px rgba(0, 0, 0, 0.04),
                0 1px 0 rgba(255, 255, 255, 0.9); /* Pantulan cahaya di bibir bawah input */
        }
        .input-field:focus { 
            background: #ffffff; 
            border-color: #d1d5db;
            /* Saat fokus, efek lubang memudar dan kotak memancarkan glow luar */
            box-shadow: 
                inset 0 1px 2px rgba(0, 0, 0, 0.02),
                0 0 0 4px rgba(17, 24, 39, 0.06),
                0 4px 6px -1px rgba(0, 0, 0, 0.05); 
        }

        /* Primary Button dengan efek Timbul (3D Extrude) */
        .btn-primary {
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(180deg, #1f2937 0%, #111827 100%); 
            color: #fff;
            border-radius: 12px; 
            font-size: 14px; 
            font-weight: 600;
            border: 1px solid #030712; 
            cursor: pointer; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            /* Highlight atas putih samar (bevel) & bayangan luar */
            box-shadow: 
                inset 0 1px 0 rgba(255, 255, 255, 0.15),
                0 6px 12px -2px rgba(17, 24, 39, 0.4),
                0 3px 7px -3px rgba(17, 24, 39, 0.3);
        }
        .btn-primary:hover { 
            background: linear-gradient(180deg, #374151 0%, #1f2937 100%);
            transform: translateY(-1.5px); 
            box-shadow: 
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                0 8px 16px -2px rgba(17, 24, 39, 0.5),
                0 4px 8px -3px rgba(17, 24, 39, 0.4);
        }
        .btn-primary:active { 
            background: #111827;
            transform: translateY(1px); 
            /* Berubah menjadi inner shadow saat diklik (efek tertekan) */
            box-shadow: 
                inset 0 3px 8px rgba(0, 0, 0, 0.6),
                0 1px 1px rgba(255, 255, 255, 0.2); 
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">

    <!-- Video Background -->
    <video class="video-bg" autoplay loop muted playsinline>
        <source src="{{ url_for('static', filename='video/2-20260922-0728-41.0298756.mp4') }}" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <div class="w-full max-w-sm relative z-10">

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="mb-5 p-3.5 rounded-xl text-sm font-medium backdrop-blur-md shadow-lg text-center border-t border-l border-white/20
                    {% if category == 'success' %}bg-emerald-500/80 text-white shadow-emerald-500/20
                    {% else %}bg-rose-500/80 text-white shadow-rose-500/20{% endif %}">
                    {{ message }}
                </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Unified Login Card dengan Efek Kedalaman -->
        <div class="glass-card rounded-[1.5rem] p-8 sm:p-10">
            
            <!-- Logo & Title -->
            <div class="text-center mb-8">
                <div class="w-16 h-16 mx-auto mb-5 rounded-2xl flex items-center justify-center p-2.5 logo-box">
                    <img src="{{ url_for('static', filename='img/haisen_logo.png') }}" alt="Haisen Studio Logo" class="w-full h-full object-contain drop-shadow-sm">
                </div>
                <h1 class="text-2xl font-bold text-gray-900 tracking-tight drop-shadow-sm">Haisen Studio</h1>
                <p class="text-sm text-gray-500 mt-1.5 font-medium">Silakan masuk ke akun Anda</p>
            </div>

            <form method="POST" class="space-y-4">
                <div>
                    <label class="block text-[11px] font-bold text-gray-500 mb-1.5 uppercase tracking-wider">Username</label>
                    <input type="text" name="username" class="input-field" placeholder="Masukkan username" autocomplete="username" required>
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-gray-500 mb-1.5 uppercase tracking-wider">Password</label>
                    <input type="password" name="password" class="input-field" placeholder="••••••••" autocomplete="current-password" required>
                </div>
                
                <!-- Teks Pengecoh / Pemisah Visual -->
                <div class="flex justify-end pt-1 pb-2">
                    <a href="#" class="text-[12px] font-medium text-gray-400 hover:text-gray-700 transition-colors">Lupa kata sandi?</a>
                </div>

                <div class="pt-2">
                    <button type="submit" class="btn-primary">
                        Masuk
                    </button>
                </div>
            </form>
        </div>

        <!-- Footer Copyright -->
        <p class="text-center text-[12px] text-white/70 mt-6 font-medium drop-shadow-sm">
            &copy; 2024 Haisen Studio. All rights reserved.
        </p>
    </div>
</body>
</html>
